<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roll direction guide · Peerprint</title>
<style>
:root{
  /* Brand colours – change here to match your identity */
  --brand:#0f8a5f; --brand-d:#0b6b49; --accent:#f5a623;
  --ink:#1c2733; --mute:#5b6b7b; --bg:#f4f7fa; --card:#fff; --line:#dbe3ea;
  --ok:#1f9d55; --bad:#d64545;
  --print:#2b6cb0; --label:#f7c15a; --liner:#b9c6d3;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;font-family:"Heebo","Assistant","Segoe UI",Arial,"Noto Sans Hebrew",sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;font-size:17px}
h1,h2,h3{line-height:1.25;margin:0 0 .4em}
h2{font-size:1.65rem;display:flex;align-items:center;gap:.6rem}
h2 .n{display:inline-grid;place-items:center;min-width:2.1rem;height:2.1rem;border-radius:50%;background:var(--brand);color:#fff;font-size:1.1rem}
h3{font-size:1.1rem;color:var(--brand-d)}
p{margin:.3em 0 .8em}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
button{font:inherit;cursor:pointer}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;height:58px}
.logo{display:flex;align-items:center;gap:8px}.lmark{height:44px;width:auto}.lfull{height:96px;width:auto}
.printlogo{display:none}
.spacer{flex:1}
.nav{display:flex;gap:4px;overflow:auto}
.nav a{white-space:nowrap;text-decoration:none;color:var(--ink);font-size:.85rem;padding:5px 10px;border-radius:99px}
.nav a:hover{background:#e8f3ee}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px;font-size:.9rem;color:var(--ink)}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-d)}

/* hero */
.hero{padding:34px 0 10px}
.hero .wrap{display:grid;grid-template-columns:1fr 190px;gap:24px;align-items:center}
.hero h1{font-size:2.3rem;color:var(--brand-d)}
.hero .sub{font-size:1.2rem;color:var(--mute)}
.why{background:#fff;border:1px solid var(--line);border-inline-start:5px solid var(--accent);border-radius:12px;padding:12px 16px;margin-top:14px}

/* sections */
section.sec{padding:34px 0 10px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 1px 3px rgba(20,40,60,.05)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.rule{background:#e8f5ee;border:1px solid #bfe3d0;border-radius:12px;padding:10px 14px;margin:14px 0}
.tip{background:#fff8e6;border:1px solid #f3dfaa;border-radius:12px;padding:10px 14px;margin:14px 0}
svg{display:block;max-width:100%;height:auto}
.ltr{direction:ltr}

/* reveal */
.reveal{opacity:0;transform:translateY(18px);transition:opacity .6s,transform .6s}
.reveal.in{opacity:1;transform:none}

/* P man */
.arm{fill:none;stroke:var(--brand);stroke-width:6;stroke-linecap:round}
.al{transform-origin:20px 98px}
.ar{transform-origin:36px 100px}
.wave{animation:wave .9s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-20deg)}to{transform:rotate(30deg)}}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}

/* section 1 */
.cards4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.vcard{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 8px 12px;text-align:center}
.vcard.ok{border-color:var(--ok)}.vcard.bad{border-color:#f0c4c4}
.stk{fill:#fff;stroke:#b8c4d0;stroke-width:2}
.pill rect{fill:var(--bad)}.pill.ok rect{fill:var(--ok)}
.pill text{fill:#fff;font-size:11px;font-weight:700;font-family:inherit}
.turn{transform:rotate(var(--a))}
.vcard.in .turn{animation:turnTo 1.2s cubic-bezier(.3,1.4,.5,1) .25s both}
@keyframes turnTo{from{transform:rotate(0)}to{transform:rotate(var(--a))}}
.verdict{font-weight:700}
.vcard.ok .verdict{color:var(--ok)}.vcard.bad .verdict{color:var(--bad)}
.vcard small{display:block;color:var(--mute);font-size:.85rem;line-height:1.35}
.turnbox{display:grid;grid-template-columns:230px 1fr;gap:18px;align-items:center;margin-top:16px}
#turnStatus{font-size:1.15rem;font-weight:700}
#turnStatus.ok{color:var(--ok)}#turnStatus.bad{color:var(--bad)}

/* section 2 */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 14px;border-inline-end:1px solid var(--line)}
.seg button:last-child{border-inline-end:0}
.seg button[aria-pressed=true]{background:var(--brand);color:#fff}
.ctl{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:8px 0}
.ctl b{min-width:5.5em}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--mute);margin-top:6px}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-inline-end:5px;vertical-align:middle}
.spin{transform-origin:140px 150px;animation:spin 7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.belt{animation:belt 2.2s linear infinite}
@keyframes belt{to{transform:translateX(120px)}}
.pf{transform:scaleY(var(--flip,1));transition:transform .7s}
.pr{transform:rotate(var(--rot,0deg));transition:transform .7s}
#belt>g{transition:opacity .5s}
#beltSvg .barL{display:none}#beltSvg.rev .barL{display:inline}#beltSvg.rev .barR{display:none}#beltSvg.rev .belt{animation-direction:reverse}
#rollSvg{transition:transform .5s}#rollSvg.mir{transform:scaleX(-1)}
.nowshow{margin-top:8px;font-weight:700;color:var(--brand-d);font-size:1.05rem}
.dash{stroke-dasharray:7 6;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-26}}

/* section 3 */
.chart{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;direction:ltr}
.rowlbl{grid-column:1/-1;font-weight:700;color:var(--mute);font-size:.9rem;margin-top:4px}
.pos{position:relative;text-align:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px 6px 10px;transition:.25s}
.pos:hover{border-color:var(--brand)}
.pos .num{position:absolute;top:6px;inset-inline-start:8px;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.95rem}
.pos .tg{font-size:.82rem;color:var(--mute);line-height:1.3;min-height:2.6em;direction:inherit}
.pos.sel{border-color:var(--brand);box-shadow:0 0 0 4px rgba(15,138,95,.18);background:#f1faf6;animation:pulse 1.6s ease-in-out infinite}
.pos.sel .num{background:var(--brand)}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(15,138,95,.06)}}
.mbelt{}
.pos.sel .mbelt{animation:mbelt 1.5s linear infinite}
@keyframes mbelt{to{transform:translateX(60px)}}
.pos.sel .mbelt.rv{animation-direction:reverse}
.result{display:flex;align-items:center;gap:16px;background:var(--brand);color:#fff;border-radius:16px;padding:14px 18px;margin-top:16px;flex-wrap:wrap}
.result .big{font-size:3rem;font-weight:800;line-height:1;background:#fff;color:var(--brand-d);width:78px;height:78px;border-radius:16px;display:grid;place-items:center}
.result .d{font-size:1.15rem;font-weight:600}
.result small{display:block;opacity:.9;font-weight:400}
ul.clean{margin:.3em 0;padding-inline-start:1.3em}ul.clean li{margin:.25em 0}

/* section 4 */
.rollsvg[data-focus=od] .idg{opacity:.18}.rollsvg[data-focus=id] .odg{opacity:.18}
.dl{fill:none;stroke-width:3.5;stroke-linecap:round;stroke-dasharray:420;animation:draw 3.2s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:420}40%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:420}}
.dtxt{font-weight:800;font-size:15px;font-family:inherit}
.al-b{transition:transform .7s cubic-bezier(.3,1.3,.5,1)}
.al-g{transition:transform .7s}
.alsvg[data-al=top] .al-b{transform:translateY(0)}.alsvg[data-al=top] .al-g{transform:translateY(0)}
.alsvg[data-al=center] .al-b{transform:translateY(35px)}.alsvg[data-al=center] .al-g{transform:translateY(80px)}
.alsvg[data-al=bottom] .al-b{transform:translateY(70px)}.alsvg[data-al=bottom] .al-g{transform:translateY(160px)}
.alsvg[data-al=none] .al-g{opacity:0}.alsvg[data-al=none] svg-wrap{opacity:.5}
.alsvg[data-al=none] .al-b{transform:translateY(35px);opacity:.5}
.inputs{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0}
.inputs label{display:flex;flex-direction:column;font-size:.9rem;color:var(--mute);gap:3px}
.inputs input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;width:170px;direction:ltr;text-align:start}
.summary{white-space:pre-wrap;background:#0f1b26;color:#e6f2ec;border-radius:12px;padding:14px 16px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.95rem;margin:10px 0;direction:inherit}

footer{margin:40px 0 0;background:#fff;border-top:1px solid var(--line);padding:22px 0;color:var(--mute);font-size:.95rem}
footer .wrap{display:flex;gap:20px;flex-wrap:wrap;justify-content:space-between;align-items:center}
footer b{color:var(--ink)}
.paused *{animation-play-state:paused!important}

@media (max-width:820px){
  .hero .wrap{grid-template-columns:1fr}.hero svg{margin:auto}
  .grid2,.turnbox{grid-template-columns:1fr}
  .cards4,.chart{grid-template-columns:repeat(2,1fr)}
  .nav{display:none}
  h2{font-size:1.4rem}.hero h1{font-size:1.8rem}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}
}

/* ===== PDF / print ===== */
@page{size:A4;margin:11mm}
@media print{
  body{background:#fff;font-size:12.5px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .noprint,.top{display:none!important}
  .printlogo{display:block;margin-bottom:2px}.printlogo img{height:40px!important}.lfull{height:46px}.hero{padding:0}.hero .sub{font-size:1rem}
  *{animation:none!important;transition:none!important}
  .reveal{opacity:1!important;transform:none!important}
  .panel,.vcard,.pos,.rule,.tip,.result,.why{box-shadow:none!important;break-inside:avoid}
  .hero{padding:0}.hero h1{font-size:1.7rem}
  section.sec{padding:14px 0 0;break-inside:avoid}
  #s2{break-before:page}#s3{break-before:page}#s4{break-before:page}
  #rollFront{max-width:250px;margin:auto}#alSvg svg{max-width:300px}
  hr{margin:10px 0!important}.summary{margin:6px 0}
  .hero .wrap{grid-template-columns:1fr 150px!important}
  .grid2{grid-template-columns:1fr 1fr!important}
  .turnbox{grid-template-columns:230px 1fr!important}
  .cards4,.chart{grid-template-columns:repeat(4,1fr)!important}
  section.sec{break-inside:auto}
  .hero svg{width:150px}
  .reveal{break-inside:avoid}
  .panel{padding:12px}
  p{margin:.2em 0 .5em}
  h2{font-size:1.25rem}
  .wrap{max-width:none;padding:0}
  .pos.sel{animation:none}
  footer{margin-top:8px;padding:6px 0;font-size:11px}
}
</style>
</head>

 s2H:'הסתכלו על הגליל: לאיזה כיוון הוא נפתח?',
 s2P:'החזיקו את הגליל כך שהמדבקות יוצאות ימינה, כמו שיזינו אותו למכונה. ענו על שתי שאלות. לחצו על התשובות למטה וצפו בגליל.',

 woundLbl:'סוג הגלגול:',woundOut:'גלגול חיצוני',woundIn:'גלגול פנימי',
 q1tip:'<b>לא בטוחים?</b> קלפו מדבקה אחת. צד ההדפסה הוא הצד המרוחק מנייר הגב. מדבקות שקופות עלולות להיראות מודפסות כשהן לא – תמיד בדקו.',
 q2H:'שאלה 2 – מה יוצא ראשון מהגליל?',
 q2P:'כשהמדבקות יוצאות, איזה קצה של הגרפיקה יוצא קודם? P צולל <b>ראש קודם</b>, או <b>רגליים קודם</b>, או מוביל עם הצד <b>הימני</b> או <b>השמאלי</b> שלו.',
 edgeLbl:'הקצה המוביל:',head:'הראש ראשון',foot:'הרגל ראשונה',rightE:'צד ימין ראשון',leftE:'צד שמאל ראשון',
 q2note:'“ימין” ו”שמאל” הם כפי שאתם רואים את הגרפיקה כשהיא ישרה.',
 lgFace:'צד ההדפסה',lgLabel:'מדבקה',lgLiner:'נייר גב (ליינר)',
 viewSide:'מבט צד על הגליל',viewFront:'מבט על המדבקות בזמן שהן יוצאות',
 outCap:'ההדפסה נמצאת בצד החיצוני של הגליל.',inCap:'ההדפסה צמודה לליבה – רואים רק את נייר הגב.',
 unw:'כיוון הפתיחה',first:'הקצה הזה יוצא ראשון',ghost:'צד ההדפסה מוסתר – רואים את צד נייר הגב.',
 nowShow:'מוצג עכשיו:',
 s3H:'התאימו למספר',
 s3P:'שתי התשובות יחד נותנות מספר אחד בין 1 ל-8. לחצו על כרטיס כדי לראות אותו בתנועה, או השתמשו בתשובות משלב 2.',
 row1:'גלגול חיצוני – הדפסה בצד החיצוני (<bdi>1–4</bdi>)',row2:'גלגול פנימי – הדפסה בצד הפנימי (<bdi>5–8</bdi>)',
 resLbl:'כיוון הגלגול שלכם',
 ruleThumb:'<b>כלל אצבע:</b> <bdi>1–4</bdi> = הדפסה כלפי חוץ · <bdi>5–8</bdi> = הדפסה כלפי פנים. בכל קבוצה: 1 ראש · 2 רגל · 3 צד ימין · 4 צד שמאל.',
 mistH:'טעויות נפוצות',
 m1:'קביעת הכיוון לפי איך שהגליל מונח על מדף – תמיד קובעים לפי איך שיוזן למכונה.',
 m2:'בלבול בין “ראש ראשון” לבין “הטקסט קריא ישר”. כשהגרפיקה מסובבת על הרצועה, אלה לא אותו דבר.',
 m3:'שוכחים לבדוק שוב את המספר כשהמדבקה מסובבת ב-90° על הגיליון.',
 m4:'לא בטוחים? שלחו לנו תמונה של הגליל כשהמדבקה הראשונה קלופה מעט.',
 s4H:'מדדו את הגליל',
 s4P:'שתי מדידות, במילימטרים. סרגל או מטר גמיש – קירוב מספיק.',
 odH:'קוטר חיצוני של הגליל (ירוק)',odP:'מדדו את כל הגליל מקצה לקצה דרך המרכז, בנקודה הרחבה ביותר.',
 idH:'קוטר פנימי של הליבה (אדום)',idP:'מדדו את החור הריק של ליבת הקרטון מבפנים – בלי עובי דופן הליבה.',
 cores:'<b>ליבות נפוצות:</b> 25 מ"מ (1″), 40 מ"מ, 76 מ"מ (3″).',
 odIn:'קוטר חיצוני (מ"מ)',idIn:'קוטר פנימי של הליבה (מ"מ)',odTag:'Ø חיצוני',idTag:'Ø ליבה',
 foc_both:'שניהם',foc_od:'Ø חיצוני',foc_id:'Ø ליבה',
 fbH:'חזית וגב על אותו גליל?',
 fbP:'כשגליל אחד נושא סט – מדבקת חזית ומדבקת גב בגבהים שונים – ספרו לנו איך הן מיושרות. הסתכלו על שתיהן כשהראש למעלה ובחרו: ישור ל<b>למעלה</b>, ל<b>מרכז</b> או ל<b>למטה</b>.',
 fbNote:'הקו הצהוב המקווקו מראה את הקצה או קו האמצע המשותף.',
 al_none:'לא סט חזית/גב',al_top:'למעלה',al_center:'מרכז',al_bottom:'למטה',front:'חזית',back:'גב',
 sumH:'פרטי ההזמנה שלכם',copyBtn:'העתקה',copied:'הועתק ✔',sumHint:'הדביקו את זה בהזמנה או במייל.',
 sumPos:'כיוון גלגול',sumOD:'קוטר חיצוני של הגליל',sumID:'קוטר פנימי של הליבה',sumAl:'יישור חזית/גב',sumNone:'לא סט חזית/גב',
 fAddr:'רח\' המסגר 4, נס-ציונה',fTel:'טלפון',fFax:'פקס'
}};

let lang=(new URLSearchParams(location.search).get('lang')||'he');
if(!T[lang])lang='en';
const st={wound:'out',edge:'head',al:'none',focus:'both',turn:0};
const t=k=>T[lang][k];
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const EDGES=['head','foot','right','left'];
const ANG={head:90,foot:-90,right:0,left:180};
const edgeTxt=e=>t(e==='right'||e==='left'?e+'E':e);
const posOf=(w,e)=>(w==='out'?0:4)+EDGES.indexOf(e)+1;

/* the P stick character: face = head, shoes = feet */
function pman(wave){return `<g transform="translate(-49,-77)">
<path d="M28 128V16H56a29 29 0 0 1 0 58H28" fill="none" stroke="var(--brand)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="50" cy="42" r="3.6" fill="var(--ink)"/><circle cx="67" cy="42" r="3.6" fill="var(--ink)"/>
<path d="M50 53q8.5 9 17 0" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>
<path d="M10 143H46" stroke="var(--ink)" stroke-width="9" stroke-linecap="round"/>
<path class="arm al" d="M20 98L5 84"/><path class="arm ar ${wave?'wave':''}" d="M36 100L56 88"/></g>`}

/* ---------- section 1 ---------- */
function stickerCard(a,ok,cap){
  const pill={0:[130,16],90:[222,90],180:[130,166],270:[38,90]}[a];
  return `<div class="vcard ${ok?'ok':'bad'} reveal"><svg viewBox="0 0 260 180" aria-hidden="true">
  <rect x="70" y="35" width="120" height="110" rx="14" class="stk"/>
  <g transform="translate(130,90)"><g class="turn" style="--a:${a}deg"><g transform="scale(.62)">${pman(ok)}</g></g></g>
  <g class="pill ${ok?'ok':'bad'}" transform="translate(${pill[0]},${pill[1]})"><rect x="-26" y="-10" width="52" height="20" rx="10"/><text y="4" text-anchor="middle">${t('headPill')}</text></g></svg>
  <div class="verdict">${ok?'✔ '+t('okT'):'✘ '+t('badT')}</div><small>${cap}</small></div>`;
}
function renderS1(){
  $('#cards4').innerHTML=stickerCard(0,true,t('c1'))+stickerCard(180,false,t('c2'))+stickerCard(270,false,t('c3'))+stickerCard(90,false,t('c4'));
  $('#cards4').style.direction='ltr';
  $$('#cards4 .vcard small').forEach(s=>s.style.direction=T[lang].dir);
  $('#turnP').innerHTML=pman(false);
  $('#turnBtn').textContent=t('turnBtn');
  updTurn(true);
  observe();
}
function updTurn(noAnim){
  const g=$('#turnG');g.style.transform=`rotate(${st.turn*90}deg)`;
  const i=((st.turn%4)+4)%4, names=['top','right','bottom','left'], ok=i===0;
  const s=$('#turnStatus');s.className=ok?'ok':'bad';
  s.innerHTML=`${t('headAt')} <u>${t(names[i])}</u><br>${ok?t('turnOk'):t('turnBad')}`;
}

/* ---------- section 2 ---------- */
let curRot=90;
function setRot(target){let d=((target-curRot)%360+540)%360-180;curRot+=d;return curRot}
function layers(w){
  const cx=140,cy=150;
  const L=w==='out'?[['face',116,120],['label',106,116],['liner',98,106]]:[['liner',112,120],['label',102,112],['face',98,102]];
  const col={face:'var(--print)',label:'var(--label)',liner:'var(--liner)'};
  let s='';
  L.forEach(([k,r1,r2])=>{const r=(r1+r2)/2,sw=r2-r1;
    s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${col[k]}" stroke-width="${sw}"/><rect x="${cx}" y="${cy-r2}" width="190" height="${sw}" fill="${col[k]}"/>`;});
  return s;
}
function beltLabels(){
  let s='';
  for(let i=0;i<5;i++){const x=i*120-110;
    s+=`<g transform="translate(${x},0)"><rect x="0" y="70" width="100" height="100" rx="10" class="lab" fill="#fff" stroke="#8fa2b4" stroke-width="2"/>
    <rect class="barR" x="90" y="70" width="10" height="100" rx="4" fill="var(--accent)"/><rect class="barL" x="0" y="70" width="10" height="100" rx="4" fill="var(--accent)"/>
    <g transform="translate(50,120)"><g class="pf"><g class="pr"><g transform="scale(.5)" class="pg">${pman(false)}</g></g></g></g></g>`;}
  $('#belt').innerHTML=s;
}
function renderS2(){
  $$('#segWound button').forEach(b=>{b.textContent=b.dataset.w==='out'?t('woundOut'):t('woundIn');b.setAttribute('aria-pressed',b.dataset.w===st.wound)});
  $$('#segEdge button').forEach(b=>{b.textContent=edgeTxt(b.dataset.e);b.setAttribute('aria-pressed',b.dataset.e===st.edge)});
  $('#rollLayers').innerHTML=layers(st.wound);
  $('#viewSideCap').innerHTML=`<b>${t('viewSide')}</b> – ${st.wound==='out'?t('outCap'):t('inCap')}`;
  $('#viewFrontCap').innerHTML=`<b>${t('viewFront')}</b>`;
  const svg=$('#beltSvg'),out=st.wound==='out';
  svg.style.setProperty('--rot',setRot(ANG[st.edge])+'deg');
  svg.style.setProperty('--flip',1);
  $$('#belt > g').forEach(g=>g.style.opacity=out?1:.55);
  
  
  $('#band').setAttribute('fill',out?'var(--liner)':'var(--label)');
  $('#unwTxt').textContent=t('unw');
  $('#firstTxt').textContent='▶ '+t('first');
  $('#ghostTxt').textContent='';
  $('#nowShow').textContent=`${t('nowShow')} ${out?t('woundOut'):t('woundIn')} · ${edgeTxt(st.edge)}`;
}

/* ---------- section 3 ---------- */
function miniCard(p){
  const out=p<=4,e=EDGES[(p-1)%4],ang=ANG[e];
  let items='';for(let i=0;i<5;i++){const x=i*60-40;
    items+=`<g transform="translate(${x},0)" opacity="${out?1:.55}"><rect x="0" y="33" width="46" height="46" rx="6" fill="#fff" stroke="#8fa2b4" stroke-width="1.5"/><rect x="42" y="33" width="4" height="46" rx="2" fill="var(--accent)"/>
    <g transform="translate(23,56) rotate(${ang}) scale(.25)">${pman(false)}</g></g>`;}
  return `<button class="pos" data-p="${p}" aria-pressed="false"><span class="num">${p}</span>
  <svg viewBox="0 0 200 112"><defs><clipPath id="mc${p}"><rect x="0" y="28" width="200" height="56"/></clipPath></defs>
  <rect x="0" y="28" width="200" height="56" fill="${out?'var(--liner)':'var(--label)'}" opacity=".55"/>
  <g clip-path="url(#mc${p})"><g class="mbelt">${items}</g></g>
  <path d="M110 14H186" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/><path d="M180 9L190 14L180 19Z" fill="var(--accent)"/>
  <text x="100" y="104" text-anchor="middle" font-size="11" fill="#5b6b7b" font-family="inherit">${out?'OUT':'IN'}</text></svg>
  <div class="tg">${edgeTxt(e)}</div></button>`;
}
function renderS3(){
  let h=`<div class="rowlbl" style="direction:${T[lang].dir}">${t('row1')}</div>`;
  for(let p=1;p<=4;p++)h+=miniCard(p);
  h+=`<div class="rowlbl" style="direction:${T[lang].dir}">${t('row2')}</div>`;
  for(let p=5;p<=8;p++)h+=miniCard(p);
  $('#chart').innerHTML=h;
  $$('#chart .tg').forEach(x=>x.style.direction=T[lang].dir);
  updS3();
}
function updS3(){
  const p=posOf(st.wound,st.edge);
  $$('#chart .pos').forEach(c=>{const on=+c.dataset.p===p;c.classList.toggle('sel',on);c.setAttribute('aria-pressed',on)});
  $('#resNum').textContent=p;
  $('#resTxt').textContent=`${t('resLbl')}: ${p}`;
  $('#resSub').textContent=`${st.wound==='out'?t('woundOut'):t('woundIn')} · ${edgeTxt(st.edge)}`;
  $('#resSub').parentNode.parentNode.style.direction=T[lang].dir;
}

/* ---------- section 4 ---------- */
function renderS4(){
  $('#odTag').textContent=t('odTag');$('#idTag').textContent=t('idTag');
  $$('#segFocus button').forEach(b=>{b.textContent=t('foc_'+b.dataset.f);b.setAttribute('aria-pressed',b.dataset.f===st.focus)});
  $('#rollFront').dataset.focus=st.focus;
  $$('#segAl button').forEach(b=>{b.textContent=t('al_'+b.dataset.a);b.setAttribute('aria-pressed',b.dataset.a===st.al)});
  $('#alSvg').dataset.al=st.al;
  $('#frontTxt').textContent=t('front');$('#backTxt').textContent=t('back');
  $('#alP1').innerHTML=pman(false);$('#alP2').innerHTML=pman(false);
  renderSummary();
}
function renderSummary(){
  const p=posOf(st.wound,st.edge),od=$('#odVal').value.trim(),id=$('#idVal').value.trim();
  const al=st.al==='none'?t('sumNone'):t('al_'+st.al);
  $('#summary').textContent=
`${t('sumPos')}: ${p} (${st.wound==='out'?t('woundOut'):t('woundIn')}, ${edgeTxt(st.edge)})
${t('sumOD')}: ${od?od+' mm':'___ mm'}
${t('sumID')}: ${id?id+' mm':'___ mm'}
${t('sumAl')}: ${al}`;
}

/* ---------- shell ---------- */
function applyLang(){
  const d=T[lang];
  document.documentElement.lang=lang;document.documentElement.dir=d.dir;
  document.title=lang==='he'?'מדריך כיוון גליל · Peerprint':'Roll direction guide · Peerprint';
  $$('[data-i18n]').forEach(el=>el.innerHTML=d[el.dataset.i18n]||'');
  $('#btnLang').textContent=d.langBtn;
  $('#btnPause').textContent=document.body.classList.contains('paused')?d.play:d.pause;
  $('#fAddr').textContent=d.fAddr;
  $('#fContact').innerHTML=`${d.fTel}: 08-6226222 · ${d.fFax}: 08-6226200<br>stickers@peerprint.com · www.peerprint.com`;
  $('#copyBtn').textContent=d.copyBtn;
  $('#heroP').innerHTML=pman(true);
  renderS1();renderS2();renderS3();renderS4();
}
let io;
function observe(){
  if(!('IntersectionObserver' in window)){$$('.reveal').forEach(e=>e.classList.add('in'));return}
  io=io||new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.15});
  $$('.reveal:not(.in)').forEach(e=>io.observe(e));
}
function sync(){renderS2();updS3();renderSummary()}

$('#segWound').addEventListener('click',e=>{const b=e.target.closest('button');if(b){st.wound=b.dataset.w;sync()}});
$('#segEdge').addEventListener('click',e=>{const b=e.target.closest('button');if(b){st.edge=b.dataset.e;sync()}});
$('#chart').addEventListener('click',e=>{const c=e.target.closest('.pos');if(c){const p=+c.dataset.p;st.wound=p<=4?'out':'in';st.edge=EDGES[(p-1)%4];sync()}});
$('#segFocus').addEventListener('click',e=>{const b=e.target.closest('button');if(b){st.focus=b.dataset.f;renderS4()}});
$('#segAl').addEventListener('click',e=>{const b=e.target.closest('button');if(b){st.al=b.dataset.a;renderS4()}});
$('#turnBtn').addEventListener('click',()=>{st.turn++;updTurn()});
['#odVal','#idVal'].forEach(s=>$(s).addEventListener('input',renderSummary));
$('#btnLang').addEventListener('click',()=>{lang=lang==='he'?'en':'he';applyLang()});
$('#btnPause').addEventListener('click',()=>{document.body.classList.toggle('paused');applyLang()});
$('#btnPdf').addEventListener('click',()=>window.print());
$('#copyBtn').addEventListener('click',async()=>{
  const txt=$('#summary').textContent;
  try{await navigator.clipboard.writeText(txt)}catch(_){const a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}
  $('#copyBtn').textContent=t('copied');setTimeout(()=>$('#copyBtn').textContent=t('copyBtn'),1800);
});
window.addEventListener('beforeprint',()=>$$('.reveal').forEach(e=>e.classList.add('in')));
beltLabels();applyLang();
</script>
</body>
</html>
